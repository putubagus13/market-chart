<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>ChartLab</title>
        <meta name="description" content="ChartLab is a free, open-source charting workspace: candlesticks, indicators and drawing tools for any market." />
        <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
        <meta name="theme-color" content="#131722" media="(prefers-color-scheme: dark)" />
        <meta property="og:site_name" content="ChartLab" />
        <meta property="og:type" content="website" />
        <meta property="og:title" content="ChartLab" />
        <meta property="og:description" content="A free, open-source charting workspace: candlesticks, indicators and drawing tools for any market." />
        <meta property="og:url" content="https://app.disatu.xyz/" />
        <meta property="og:image" content="https://app.disatu.xyz/og-image.png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta property="og:image:alt" content="ChartLab, a product of Disatu" />
        <meta name="twitter:card" content="summary_large_image" />
        <link rel="icon" href="/favicon.ico" sizes="any" />
        <link rel="icon" type="image/svg+xml" href="/chartlab-favicon.svg" />
        <link rel="icon" type="image/png" sizes="32x32" href="/chartlab-favicon-32.png" />
        <link rel="apple-touch-icon" href="/chartlab-favicon-180.png" />
        <link rel="manifest" href="/site.webmanifest" />
        <script>
            // Paint the right background before the chart boots, so an embedded page never flashes
            // the wrong theme (same query as app/embed.ts: ?theme=dark|light).
            (function () {
                var t = new URLSearchParams(location.search).get('theme');
                var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
                document.documentElement.style.background = dark ? '#131722' : '#ffffff';
            })();
        </script>
        <style>
            html,
            body {
                margin: 0;
                height: 100%;
            }
            #chart {
                position: absolute;
                inset: 0;
            }
        </style>
    </head>
    <body>
        <div id="chart"></div>
        <script type="module" src="./main.ts"></script>
    </body>
</html>
