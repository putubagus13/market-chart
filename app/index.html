<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>ChartLab</title>
        <link rel="icon" href="data:," />
        <script>
            // Paint the right background before the chart boots, so an embedded page never flashes
            // the wrong theme (same query as app/embed.ts: ?theme=dark|light).
            (function () {
                var t = new URLSearchParams(location.search).get('theme');
                var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
                document.documentElement.style.background = dark ? '#131722' : '#ffffff';
            })();
        </script>
        <style>
            html,
            body {
                margin: 0;
                height: 100%;
            }
            #chart {
                position: absolute;
                inset: 0;
            }
        </style>
    </head>
    <body>
        <div id="chart"></div>
        <script type="module" src="./main.ts"></script>
    </body>
</html>
